[package]
name = "sidepeek"
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
description = "A GPUI desktop sidebar for notes, commands, launchers, and clipboard history"
publish = false
build = "build.rs"

[features]
smoke-test = ["gpui-kit/test-support", "dep:gpui-platform-testing"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
gpui-kit = "=0.6.0"
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smol = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# GPUI Kit 0.6.0 does not forward test-support to its native platform crate.
# Unify this feature only for optional native-rendering tests.
gpui-platform-testing = { package = "gpui-pre-platform", version = "=0.3.3", default-features = false, features = ["test-support"], optional = true }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization"
] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0
incremental = true

[profile.release]
strip = "debuginfo"
lto = "thin"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
